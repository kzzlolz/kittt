<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Itsuki's Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating decorations -->
    <div class="floating-stars" aria-hidden="true">
        <span>✦</span>
        <span>✧</span>
        <span>⋆</span>
        <span>✦</span>
        <span>✧</span>
        <span>⋆</span>
        <span>✦</span>
        <span>✧</span>
    </div>

    <main class="app">

        <!-- Animated banner -->
        <div class="banner">
            <img src="assets/banner.gif" alt="Itsuki banner">
        </div>

        <!-- Header -->
        <section class="header">

            <img
                class="avatar"
                src="assets/itsuki.png"
                alt="Itsuki"
            >

            <div class="bot-info">
                <h1>Itsuki</h1>

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>

                <p>Mmmm... I love food.. 🍜</p>
            </div>

        </section>

        <!-- Private bot notice -->
        <div class="private-notice">
            <strong> THIS IS A PRIVATE BOT</strong>
            <span>Made solely for a server</span>
        </div>

        <!-- Navigation -->
        <nav class="navigation">

            <button
                class="nav-button"
                id="commands-button"
                type="button"
            >
                📜 𝒞𝑜𝓂𝓂𝒶𝓃𝒹𝓈
            </button>

            <button
                class="nav-button"
                id="interact-button"
                type="button"
            >
                🍙 𝓘𝓷𝓽𝓮𝓻𝓪𝓬𝓽
            </button>

            <button
                class="nav-button"
                id="widgets-button"
                type="button"
            >
                🧩 𝒲𝒾𝒹𝑔𝑒𝓉𝓈
            </button>

        </nav>

        <!-- Main content -->
        <section class="content" id="content">

            <div class="welcome">
                <div class="welcome-star">✦</div>

                <h2>Welcome to Itsuki's Dashboard!</h2>

                <p>
                    Choose an option above to interact with Itsuki. ♡
                </p>
            </div>

        </section>

        <!-- Footer -->
        <footer>
            ✦ Itsuki • Your hungry little bot ✦
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
