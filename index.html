<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            rgba(20, 10, 15, 0.85),
            rgba(35, 12, 20, 0.95)
        ),
        url("https://media.giphy.com/media/l0MYB8Ory7HjuBxK0/giphy.gif");

    background-size: cover;
    background-position: center;

    font-family: Arial, sans-serif;
}

/* Floating red hearts */
.heart {
    position: fixed;
    color: #ff1a40;
    opacity: 0.4;
    font-size: 25px;
    pointer-events: none;
    animation: floatHeart 7s linear infinite;
    filter: drop-shadow(0 0 6px rgba(255, 0, 50, 0.6));
}

.heart:nth-child(1) { left: 10%; bottom: -30px; animation-delay: 0s; }
.heart:nth-child(2) { left: 25%; bottom: -40px; animation-delay: 2s; }
.heart:nth-child(3) { left: 50%; bottom: -20px; animation-delay: 4s; }
.heart:nth-child(4) { left: 75%; bottom: -30px; animation-delay: 1s; }
.heart:nth-child(5) { left: 90%; bottom: -40px; animation-delay: 3s; }

@keyframes floatHeart {
    0% { transform: translateY(0) scale(0.8) rotate(0deg); }
    50% { transform: translateY(-50vh) scale(1.1) rotate(15deg); }
    100% { transform: translateY(-110vh) scale(0.8) rotate(-15deg); }
}

/* Entire layout */
.layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 1200px;
    padding: 20px;
}

/* Main widget */
.widget {
    width: 850px;
    max-width: 70vw;
    padding: 22px;
    border: 3px solid rgba(255, 26, 64, 0.6);
    border-radius: 25px;
    background: rgba(25, 12, 18, 0.75);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 20px rgba(255, 0, 40, 0.4), 0 0 50px rgba(150, 0, 20, 0.2);
    animation: widgetFloat 4s ease-in-out infinite;
    transform-style: preserve-3d;
    transition: transform 0.15s ease;
}

@keyframes widgetFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

/* Profile */
.profile {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 18px;
}

/* Avatar Container */
.avatar-container {
    position: relative;
    width: 125px;
    height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Neon Fuzzy & Glitchy PFP Decoration Ring */
.neon-ring {
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    border: 3px solid #ff1a40;
    box-shadow: 0 0 10px #ff1a40, 0 0 20px #ff1a40, inset 0 0 10px #ff1a40;
    pointer-events: none;
    z-index: 3;
    animation: spinRing 10s linear infinite, glitchRing 2.5s ease infinite;
}

@keyframes spinRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes glitchRing {
    0%, 100% {
        border-color: #ff1a40;
        box-shadow: 0 0 12px #ff1a40, 0 0 25px #ff1a40, inset 0 0 10px #ff1a40;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }
    20% {
        border-color: #ff3366;
        box-shadow: 0 0 18px #ff0033, inset 0 0 15px #ff0033;
        clip-path: polygon(0 5%, 100% 0%, 95% 100%, 5% 95%);
    }
    40% {
        border-color: #ff0033;
        box-shadow: 0 0 8px #ff0033, 0 0 30px #ff1a40;
        clip-path: polygon(5% 0%, 100% 5%, 100% 95%, 0% 100%);
    }
    60% {
        border-color: #ff4d6d;
        box-shadow: 0 0 20px #ff1a40, inset 0 0 12px #ff1a40;
        clip-path: polygon(0 0, 100% 10%, 90% 100%, 10% 90%);
    }
    80% {
        border-color: #ff1a40;
        box-shadow: 0 0 10px #ff1a40, inset 0 0 8px #ff1a40;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }
}

/* Butterfly PNG */
.widget-butterfly {
    position: absolute;
    top: -6px;
    right: -10px;
    width: 42px;
    height: auto;
    z-index: 5;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(255, 0, 40, 0.8));
    transform: rotate(15deg);
}

/* Circular Avatar Wrapper */
.avatar-circle-wrapper {
    position: absolute;
    width: 90px;
    height: 90px;
    top: 17px;
    left: 17px;
    z-index: 2;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255, 51, 102, 0.6);
    box-shadow: 0 0 10px rgba(255, 0, 40, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
}

.avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Username with smooth professional prism loop */
.username {
    font-family: "Press Start 2P", monospace;
    font-size: 22px;
    background: linear-gradient(90deg, #ff1a40, #990022, #ff1a40);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: smoothPrism 4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(255, 0, 50, 0.4));
}

@keyframes smoothPrism {
    0% { background-position: 0% center; }
    50% { background-position: 100% center; }
    100% { background-position: 0% center; }
}

.sub-info {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
}

.pronouns {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: #ff4d6d;
    background: rgba(60, 10, 20, 0.8);
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid rgba(255, 51, 102, 0.3);
}

.sleepy-status {
    font-family: "Dancing Script", cursive;
    font-size: 20px;
    color: #ff99aa;
    text-shadow: 0 0 6px rgba(255, 0, 50, 0.5);
}

/* About */
.about {
    padding: 22px;
    min-height: 170px;
    border-radius: 18px;
    background: rgba(35, 15, 22, 0.85);
    border: 1px solid rgba(255, 51, 102, 0.3);
    box-shadow: inset 0 0 20px rgba(20, 5, 10, 0.6), 0 0 15px rgba(120, 0, 30, 0.3);
    margin-bottom: 20px;
}

.about-title {
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    color: #ff8099;
    margin-bottom: 15px;
}

.about-text {
    color: #ffd9e2;
    font-size: 16px;
    line-height: 1.7;
}

.about-text p {
    margin: 0 0 15px 0;
}

.about-text p:last-child {
    margin-bottom: 0;
}

/* Stats */
.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    padding: 15px;
    border-radius: 15px;
    background: rgba(35, 15, 22, 0.85);
    border: 1px solid rgba(255, 51, 102, 0.3);
    box-shadow: inset 0 0 15px rgba(20, 5, 10, 0.5), 0 0 10px rgba(120, 0, 30, 0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.stat:hover {
    transform: translateY(-4px);
    box-shadow: inset 0 0 15px rgba(20, 5, 10, 0.5), 0 0 18px rgba(255, 51, 102, 0.4);
}

.stat-label {
    color: #ff8099;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 7px;
}

.stat-value {
    color: white;
    font-size: 15px;
    font-weight: bold;
}

/* Music Player */
.music-player {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 18px;
    background: rgba(35, 15, 22, 0.85);
    border: 1px solid rgba(255, 51, 102, 0.3);
    box-shadow: inset 0 0 15px rgba(20, 5, 10, 0.5), 0 0 12px rgba(120, 0, 30, 0.2);
}

.album {
    width: 70px;
    height: 70px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid rgba(255, 51, 102, 0.6);
    box-shadow: 0 0 10px rgba(255, 0, 40, 0.5);
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-name {
    color: white;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 5px;
}

.artist {
    color: #ff8099;
    font-size: 14px;
    margin-bottom: 12px;
}

.progress {
    width: 100%;
    height: 5px;
    overflow: hidden;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.15);
}

.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 10px;
    background: #ff3366;
    animation: musicProgress 60s linear infinite;
}

@keyframes musicProgress {
    0% { width: 0%; }
    100% { width: 100%; }
}

.play-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: rgba(204, 0, 51, 0.85);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.play-button:hover {
    transform: scale(1.12);
    background: rgba(255, 0, 60, 1);
    box-shadow: 0 0 15px rgba(255, 0, 50, 0.8);
}

/* Links */
.links {
    display: flex;
    gap: 15px;
}

.link-button {
    flex: 1;
    padding: 14px;
    border-radius: 15px;
    text-decoration: none;
    text-align: center;
    color: white;
    font-weight: bold;
    background: rgba(179, 0, 45, 0.75);
    border: 1px solid rgba(255, 51, 102, 0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

.link-button:hover {
    transform: translateY(-7px) scale(1.04);
    background: rgba(210, 0, 55, 0.9);
    box-shadow: 0 10px 25px rgba(255, 0, 50, 0.4);
}

/* Side banner */
.banner-frame {
    width: 280px;
    aspect-ratio: 9 / 16;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 22px;
    border: 3px solid rgba(255, 26, 64, 0.6);
    background: rgba(25, 12, 18, 0.75);
    box-shadow: 0 0 15px rgba(255, 0, 40, 0.5), 0 0 35px rgba(150, 0, 20, 0.3);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.banner-frame:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 0 20px rgba(255, 0, 40, 0.7), 0 0 45px rgba(150, 0, 20, 0.4);
}

.banner {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 18px;
}

/* Mobile */
@media (max-width: 900px) {
    .layout {
        flex-direction: column;
        overflow-y: auto;
        max-height: 100vh;
    }
    .widget {
        width: 850px;
        max-width: 92vw;
    }
    .banner-frame {
        width: 220px;
    }
}

@media (max-width: 650px) {
    .widget { padding: 15px; }
    .username { font-size: 15px; }
    .links { flex-direction: column; }
    .stats { grid-template-columns: 1fr; }
}

</style>
</head>

<body>

<!-- Floating red hearts -->
<div class="heart">♥</div>
<div class="heart">♥</div>
<div class="heart">♥</div>
<div class="heart">♥</div>
<div class="heart">♥</div>

<!-- Everything -->
<div class="layout">

    <!-- Main Profile Widget -->
    <div class="widget">

        <div class="profile">

            <div class="avatar-container">
                <!-- Fuzzy Neon & Glitchy Spinning Outer Ring -->
                <div class="neon-ring"></div>

                <!-- Updated Butterfly PNG -->
                <img class="widget-butterfly" src="https://i.ibb.co/23B5xvbX/Untitled-design.png" alt="Red Butterfly">

                <!-- Profile Picture inside Circular Mask -->
                <div class="avatar-circle-wrapper">
                    <img
                        class="avatar"
                        src="https://i.ibb.co/nMC6jcHj/d.jpg"
                        alt="Kittt Avatar"
                    >
                </div>
            </div>

            <div>
                <div class="username">
                    Kittt
                </div>
                <div class="sub-info">
                    <span class="pronouns">she/her</span>
                    <span class="sleepy-status">hallucinating ~zzz</span>
                </div>
            </div>

        </div>

        <!-- About Me -->
        <div class="about">
            <div class="about-title">
                About Me
            </div>
            <div class="about-text">
                <p>Introvert</p>
                <p>I mainly play games, or sleep all day.</p>
                <p>Short, but dangerous >:3</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <div class="stat-label">🎂 Birthday</div>
                <div class="stat-value">16/06</div>
            </div>
            <div class="stat">
                <div class="stat-label">🍜 Fav Food</div>
                <div class="stat-value">Ramen</div>
            </div>
            <div class="stat">
                <div class="stat-label">🐱 Fav Animals</div>
                <div class="stat-value">Cats & Rabbits</div>
            </div>
            <div class="stat">
                <div class="stat-label">✨ Interests</div>
                <div class="stat-value">food, sleep, cats, shopping</div>
            </div>
        </div>

        <!-- Music -->
        <div class="music-player">
            <img
                class="album"
                src="https://i.scdn.co/image/ab67616d0000b273aeb64471596b00f380975ceb"
                alt="Bad Romance Album Art"
            >
            <div class="song-info">
                <div class="song-name">Bad Romance</div>
                <div class="artist">Lady Gaga</div>
                <div class="progress">
                    <div class="progress-fill"></div>
                </div>
            </div>
            <button class="play-button" id="playButton">❚❚</button>
        </div>

        <!-- Links + Time Badge Row -->
        <div class="links">
            <a
                class="link-button"
                href="https://tinyurl.com/kittycrumbs-bakery"
                target="_blank"
            >
                :3 Kitty Crumbs Bakery
            </a>
            <div class="link-button" style="cursor: default; background: rgba(25, 12, 18, 0.85);">
                🕐 <span id="currentTime">Loading...</span>
            </div>
        </div>

    </div>

    <!-- Side Banner -->
    <div class="banner-frame">
        <img
            class="banner"
            src="https://i.ibb.co/4Z2P02vM/a0f5972b-237b-4d99-8155-8c5b12a31be0.png"
            alt="Anime Banner"
        >
    </div>

</div>

<script>

/* Music button simulation */
const playButton = document.getElementById("playButton");
let playing = true;

playButton.addEventListener("click", () => {
    playing = !playing;
    if (playing) {
        playButton.textContent = "❚❚";
    } else {
        playButton.textContent = "▶";
    }
});

/* Live Singapore time */
function updateTime() {
    const now = new Date();
    const singaporeTime = now.toLocaleTimeString("en-SG", {
        timeZone: "Asia/Singapore",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });
    document.getElementById("currentTime").textContent = singaporeTime;
}

updateTime();
setInterval(updateTime, 1000);

/* Mouse parallax */
const widget = document.querySelector(".widget");

document.addEventListener("mousemove", (event) => {
    const x = event.clientX / window.innerWidth - 0.5;
    const y = event.clientY / window.innerHeight - 0.5;
    const rotateX = y * -2;
    const rotateY = x * 2;
    widget.style.transform = `translateY(-2px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

document.addEventListener("mouseleave", () => {
    widget.style.transform = "translateY(0) rotateX(0) rotateY(0)";
});

</script>

</body>
