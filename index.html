<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            rgba(255, 182, 193, 0.75),
            rgba(255, 240, 245, 0.95)
        ),
        url("https://media.giphy.com/media/l0MYB8Ory7HjuBxK0/giphy.gif");

    background-size: cover;
    background-position: center;

    font-family: Arial, sans-serif;
}


/* Floating hearts */

.heart {
    position: fixed;
    color: #ff5c8d;
    opacity: 0.5;
    font-size: 25px;
    pointer-events: none;
    animation: floatHeart 7s linear infinite;
}

.heart:nth-child(1) {
    left: 10%;
    bottom: -30px;
    animation-delay: 0s;
}

.heart:nth-child(2) {
    left: 25%;
    bottom: -40px;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 50%;
    bottom: -20px;
    animation-delay: 4s;
}

.heart:nth-child(4) {
    left: 75%;
    bottom: -30px;
    animation-delay: 1s;
}

.heart:nth-child(5) {
    left: 90%;
    bottom: -40px;
    animation-delay: 3s;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
    }

    50% {
        transform: translateY(-50vh) scale(1.1) rotate(15deg);
    }

    100% {
        transform: translateY(-110vh) scale(0.8) rotate(-15deg);
    }
}


/* Entire layout */

.layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;

    width: 100%;
    max-width: 1200px;
    padding: 20px;
}


/* Main widget */

.widget {
    width: 850px;
    max-width: 70vw;
    padding: 22px;

    border: 3px solid rgba(255, 150, 180, 0.8);
    border-radius: 25px;

    background: rgba(255, 245, 248, 0.35);
    backdrop-filter: blur(15px);

    box-shadow:
        0 0 15px rgba(255, 140, 170, 0.7),
        0 0 45px rgba(255, 160, 190, 0.3);

    animation: widgetFloat 4s ease-in-out infinite;

    transform-style: preserve-3d;
    transition: transform 0.15s ease;
}

@keyframes widgetFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* Profile */

.profile {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 18px;
}

.avatar-container {
    position: relative;
    width: 85px;
    height: 85px;
}

.avatar {
    width: 85px;
    height: 85px;

    border-radius: 50%;
    border: 3px solid white;

    object-fit: cover;

    box-shadow:
        0 0 12px rgba(255,255,255,0.9),
        0 0 25px rgba(255, 150, 180, 0.8);
}

.avatar-decoration {
    position: absolute;
    inset: -7px;

    border: 2px dashed rgba(255, 255, 255, 0.9);

    border-radius: 50%;

    animation: spinDecoration 8s linear infinite;
}

@keyframes spinDecoration {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* Username */

.username {
    font-family: "Press Start 2P", monospace;
    font-size: 22px;

    background: linear-gradient(
        90deg,
        #fff,
        #ff9ebb,
        #fff,
        #ff9ebb,
        #fff
    );

    background-size: 250% auto;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: prism 3s linear infinite;
}

@keyframes prism {
    from {
        background-position: 0% center;
    }

    to {
        background-position: 250% center;
    }
}

.pronouns {
    margin-top: 8px;

    font-family: "Dancing Script", cursive;
    font-size: 23px;

    color: #ff4d88;
}


/* About */

.about {
    padding: 22px;

    min-height: 170px;

    border-radius: 18px;

    background: rgba(95, 45, 65, 0.82);

    border: 1px solid rgba(255, 180, 205, 0.5);

    box-shadow:
        inset 0 0 20px rgba(40, 10, 20, 0.4),
        0 0 15px rgba(180, 80, 110, 0.25);

    margin-bottom: 20px;
}

.about-title {
    font-family: "Press Start 2P", monospace;
    font-size: 12px;

    color: #ffd1dc;

    margin-bottom: 15px;
}

.about-text {
    color: #ffe6ed;

    font-size: 16px;
    line-height: 1.7;
}

.about-text p {
    margin: 0 0 15px 0;
}

.about-text p:last-child {
    margin-bottom: 0;
}


/* Stats */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;

    margin-bottom: 20px;
}

.stat {
    padding: 15px;

    border-radius: 15px;

    background: rgba(95, 45, 65, 0.72);

    border: 1px solid rgba(255, 180, 205, 0.45);

    box-shadow:
        inset 0 0 15px rgba(40, 10, 20, 0.3),
        0 0 10px rgba(180, 80, 110, 0.18);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.stat:hover {
    transform: translateY(-4px);

    box-shadow:
        inset 0 0 15px rgba(40, 10, 20, 0.3),
        0 0 18px rgba(255, 140, 175, 0.4);
}

.stat-label {
    color: #ffd1dc;

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 7px;
}

.stat-value {
    color: white;

    font-size: 15px;

    font-weight: bold;
}


/* Music Player */

.music-player {
    display: flex;
    align-items: center;
    gap: 15px;

    padding: 14px;

    margin-bottom: 20px;

    border-radius: 18px;

    background: rgba(95, 45, 65, 0.7);

    border: 1px solid rgba(255, 180, 205, 0.5);

    box-shadow:
        inset 0 0 15px rgba(40, 10, 20, 0.3),
        0 0 12px rgba(180, 80, 110, 0.2);
}

.album {
    width: 70px;
    height: 70px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 12px;

    border: 2px solid rgba(255,255,255,0.7);

    box-shadow:
        0 0 10px rgba(255, 140, 175, 0.6);
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-name {
    color: white;

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 5px;
}

.artist {
    color: #ffd1dc;

    font-size: 14px;

    margin-bottom: 12px;
}

.progress {
    width: 100%;
    height: 5px;

    overflow: hidden;

    border-radius: 10px;

    background: rgba(255,255,255,0.25);
}

.progress-fill {
    width: 0%;
    height: 100%;

    border-radius: 10px;

    background: #ff9ebb;
}

.play-button {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border: none;
    border-radius: 50%;

    background: rgba(255, 110, 150, 0.85);

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.play-button:hover {
    transform: scale(1.12);

    background: rgba(255, 80, 130, 1);

    box-shadow:
        0 0 15px rgba(255, 110, 150, 0.8);
}


/* Buttons */

.links {
    display: flex;
    gap: 15px;
}

.link-button {
    flex: 1;

    padding: 14px;

    border-radius: 15px;

    text-decoration: none;

    text-align: center;

    color: white;

    font-weight: bold;

    background: rgba(210, 90, 130, 0.75);

    border: 1px solid rgba(255,255,255,0.5);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

.link-button:hover {
    transform: translateY(-7px) scale(1.04);

    background: rgba(200, 60, 110, 0.9);

    box-shadow:
        0 10px 25px rgba(210, 90, 130, 0.4);
}


/* Side banner */

.banner-frame {
    width: 280px;
    aspect-ratio: 9 / 16;

    flex-shrink: 0;

    overflow: hidden;

    border-radius: 22px;

    border: 3px solid rgba(255, 150, 180, 0.8);

    background: rgba(255,255,255,0.18);

    box-shadow:
        0 0 15px rgba(255, 140, 170, 0.8),
        0 0 35px rgba(255, 140, 170, 0.35);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.banner-frame:hover {
    transform: translateY(-5px) scale(1.02);

    box-shadow:
        0 0 20px rgba(255, 140, 170, 0.9),
        0 0 45px rgba(255, 140, 170, 0.45);
}

.banner {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 18px;
}


/* Mobile */

@media (max-width: 900px) {

    .layout {
        flex-direction: column;

        overflow-y: auto;
        max-height: 100vh;
    }

    .widget {
        width: 850px;
        max-width: 92vw;
    }

    .banner-frame {
        width: 220px;
    }
}

@media (max-width: 650px) {

    }

    .username {
        font-size: 15px;
    }

    .links {
        flex-direction: column;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}

</style>

<script>

/* Real Music Player Logic */

const playButton = document.getElementById("playButton");
const bgMusic = document.getElementById("bgMusic");
const progressFill = document.getElementById("progressFill");

let playing = false;

playButton.addEventListener("click", () => {
    playing = !playing;

    if (playing) {
        bgMusic.play().catch(e => console.log("Audio play blocked"));
        playButton.textContent = "❚❚";
    } else {
        bgMusic.pause();
        playButton.textContent = "▶";
    }
});

bgMusic.addEventListener("timeupdate", () => {
    if (bgMusic.duration) {
        const percent = (bgMusic.currentTime / bgMusic.duration) * 100;
        progressFill.style.width = percent + "%";
    }
});


/* Live Singapore time */

function updateTime() {

    const now = new Date();

    const singaporeTime =
        now.toLocaleTimeString("en-SG", {
            timeZone: "Asia/Singapore",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });

    document.getElementById("currentTime").textContent =
        singaporeTime;

}

updateTime();

setInterval(updateTime, 1000);


/* Mouse parallax */

const widget =
    document.querySelector(".widget");

document.addEventListener("mousemove", (event) => {

    const x =
        event.clientX / window.innerWidth - 0.5;

    const y =
        event.clientY / window.innerHeight - 0.5;

    const rotateX = y * -2;
    const rotateY = x * 2;

    widget.style.transform =
        `translateY(-2px)
         rotateX(${rotateX}deg)
         rotateY(${rotateY}deg)`;

});

document.addEventListener("mouseleave", () => {

    widget.style.transform =
        "translateY(0) rotateX(0) rotateY(0)";

});

</script>
