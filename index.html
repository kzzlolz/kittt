*{box-sizing:border-box}

body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 18px;color:var(--text);font-family:var(--sans);background:radial-gradient(ellipse at 50% 0%,#a51f43a8 0,transparent 48%),radial-gradient(ellipse at 95% 90%,#64152d88 0,transparent 42%),linear-gradient(145deg,#19070d,#310b16 55%,#17060c);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#ffc1d0 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.profile{position:relative;z-index:1;width:min(100%,440px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 30px 28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#65162cdd 0%,#35101ff2 48%,#210b15f5 100%);box-shadow:0 24px 80px #0009,0 0 45px #a51f4330,inset 0 1px #ffdbe51c;backdrop-filter:blur(14px);animation:arrive .75s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.avatar-wrap{position:relative;width:190px;height:190px;margin:0 auto 19px;display:grid;place-items:center}
.avatar{position:relative;z-index:1;width:140px;height:140px;object-fit:cover;border-radius:50%;border:3px solid #ffe0e8;box-shadow:0 10px 35px #0009,0 0 24px #ff426b66}
.avatar-decoration{position:absolute;z-index:2;width:190px;height:190px;inset:0;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 15px #ff456e99)}
h1{font:700 32px/1.1 var(--serif);letter-spacing:.3px;margin:0 0 8px;color:#fff0f3}

.bio{display:grid;gap:9px;color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 22px}
.bio p{margin:0}
.midnight{color:#f2ddec}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;width:100%;margin:0 0 22px}
.social{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#eee5ee;background:linear-gradient(135deg,#a51f432b,#ff718d12);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:11px;font-weight:600;transition:transform .2s,border-color .2s,background .2s}
.social:hover{transform:translateY(-2px);border-color:#ff718dcc;background:#ff718d26}
.social span{font-size:14px}
.music{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#7d1a362b,#ffffff05);text-align:left}
.music-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.music-heading strong{font:10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:#ffd0dc}
.music-heading span{font-size:13px;color:var(--accent)}
.music iframe{display:block;width:100%;height:152px;border:0;border-radius:9px}
.footer{margin-top:22px;color:#e7b8c4;font:9px var(--mono);letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:7px}.footer-star{display:inline-block;color:#ff7895;font-size:13px;animation:float-star 2.4s ease-in-out infinite;filter:drop-shadow(0 0 7px #ff527b99)}@keyframes float-star{0%,100%{transform:translateY(1px) rotate(-8deg)}50%{transform:translateY(-4px) rotate(12deg)}}
@media(max-width:420px){.profile{padding:28px 19px 23px}.avatar-wrap{width:174px;height:174px}.avatar{width:128px;height:128px}.avatar-decoration{width:174px;height:174px}h1{font-size:29px}.social{padding:8px 11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
/* Keep the @ fixed; type in and out only the handle, with a smile at the end. */
const titlePrefix = "@";
const titleText = "kzzlolz";
const titleSmile = " :)";
let titleLength = 0;
let deleting = false;
function typeTitle() {
  const fullSuffix = titleText + titleSmile;
  if (!deleting) {
    titleLength = Math.min(titleLength + 1, fullSuffix.length);
    document.title = titlePrefix + fullSuffix.slice(0, titleLength) + (titleLength < fullSuffix.length ? "|" : "");
    if (titleLength === fullSuffix.length) { deleting = true; setTimeout(typeTitle, 1900); }
    else setTimeout(typeTitle, 170);
    return;
  }
  titleLength = Math.max(0, titleLength - 1);
  document.title = titlePrefix + fullSuffix.slice(0, titleLength) + (titleLength > 0 ? "|" : "");
  if (titleLength === 0) { document.title = titlePrefix; deleting = false; setTimeout(typeTitle, 700); }
  else setTimeout(typeTitle, 95);
}
document.title = titlePrefix;
typeTitle();

/* Show the next midnight in Singapore, converted to each visitor's local timezone. */
const midnightLabel = document.getElementById("midnight-time");
const singaporeDateParts = new Intl.DateTimeFormat("en-CA", {
  timeZone: "Asia/Singapore",
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
});

function updateMidnightForVisitor() {
  const parts = Object.fromEntries(
    singaporeDateParts.formatToParts(new Date()).map(part => [part.type, part.value])
  );
  const nextSingaporeMidnight = Date.UTC(
    Number(parts.year),
    Number(parts.month) - 1,
    Number(parts.day) + 1,
    0, 0, 0
  ) - (8 * 60 * 60 * 1000);

  midnightLabel.textContent = new Intl.DateTimeFormat(undefined, {
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  }).format(new Date(nextSingaporeMidnight));
}

updateMidnightForVisitor();
setInterval(updateMidnightForVisitor, 60 * 1000);
</script>
